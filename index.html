<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISL · Gestión de Herramientas v3</title>
<style>
:root{--azul:#1A3A5C;--azul2:#2563A8;--azul3:#3B82C4;--azulbg:#EFF6FF;--acento:#F59E0B;--verde:#16A34A;--verdebg:#DCFCE7;--rojo:#DC2626;--rojobg:#FEE2E2;--naranja:#EA580C;--narbg:#FEF3C7;--amarillo:#CA8A04;--amarbg:#FEF9C3;--amber:#D97706;--fondo:#F1F5F9;--card:#FFFFFF;--borde:#CBD5E1;--txt1:#0F172A;--txt2:#475569;--txt3:#94A3B8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:system-ui,sans-serif;background:var(--fondo);color:var(--txt1);font-size:13px;}
.app{display:flex;flex-direction:column;height:100vh;}
.topbar{background:var(--azul);color:#fff;padding:0 16px;display:flex;align-items:stretch;height:52px;flex-shrink:0;}
.topbar-brand{display:flex;align-items:center;gap:8px;margin-right:16px;}
.topbar-brand img{height:34px;width:auto;background:#fff;padding:3px 6px;border-radius:4px;}
.topbar-brand .nombre{font-size:10px;color:#94A3B8;line-height:1.3;}
.topbar-nav{display:flex;flex:1;overflow-x:auto;}
.nav-btn{background:none;border:none;color:#94A3B8;padding:0 11px;font-size:11.5px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:all .15s;}
.nav-btn:hover{color:#fff;}.nav-btn.active{color:#fff;border-bottom-color:var(--acento);}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.conn-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;}
.conn-badge.ok{background:var(--verdebg);color:var(--verde);}.conn-badge.err{background:var(--rojobg);color:var(--rojo);}
.main{flex:1;overflow-y:auto;padding:18px;}
.card{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:16px;}
.card-title{font-size:12px;font-weight:700;color:var(--azul);margin-bottom:12px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:12px 14px;border-left:4px solid;}
.stat .val{font-size:26px;font-weight:800;line-height:1;margin:3px 0 2px;}
.stat .val-sub{font-size:11px;color:var(--txt3);}.stat .lbl{font-size:11px;color:var(--txt2);}
.tabla-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--azul);color:#fff;padding:7px 9px;text-align:left;font-weight:700;font-size:11px;white-space:nowrap;}
td{padding:6px 9px;border-bottom:1px solid var(--fondo);vertical-align:top;line-height:1.4;}
tr:hover td{background:#F8FAFC;}.td-bold{font-weight:700;color:var(--azul);}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;}
.b-verde{background:var(--verdebg);color:var(--verde);}.b-rojo{background:var(--rojobg);color:var(--rojo);}
.b-azul{background:var(--azulbg);color:var(--azul2);}.b-naranja{background:var(--narbg);color:var(--naranja);}
.b-gris{background:#F1F5F9;color:var(--txt2);}.b-acento{background:#FEF3C7;color:#92400E;}
.b-amarillo{background:var(--amarbg);color:var(--amarillo);}
.btn{border:none;border-radius:6px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-pri{background:var(--azul2);color:#fff;}.btn-pri:hover{background:var(--azul3);}
.btn-sec{background:transparent;color:var(--azul2);border:1px solid var(--azul2);}.btn-sec:hover{background:var(--azulbg);}
.btn-verde{background:var(--verde);color:#fff;}.btn-rojo{background:var(--rojo);color:#fff;}.btn-amber{background:var(--amber);color:#fff;}
.btn-xs{padding:3px 8px;font-size:11px;}.btn:disabled{opacity:.4;cursor:not-allowed;}
.form-grid{display:grid;gap:11px;}.form-grid.g2{grid-template-columns:1fr 1fr;}.form-grid.g3{grid-template-columns:1fr 1fr 1fr;}
.fg{display:flex;flex-direction:column;gap:3px;}.fg label{font-size:11px;font-weight:700;color:var(--txt2);}
.fg input,.fg select,.fg textarea{border:1px solid var(--borde);border-radius:6px;padding:6px 9px;font-size:12px;font-family:inherit;background:#fff;}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--azul2);}
.fg textarea{resize:vertical;min-height:52px;}.fg .hint{font-size:10px;color:var(--txt3);margin-top:1px;}
.span2{grid-column:span 2;}.span3{grid-column:span 3;}
.form-section{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--azul);background:var(--azulbg);padding:5px 8px;border-radius:4px;margin-top:4px;}
.modal-bg{position:fixed;inset:0;background:#00000065;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px #0004;}
.modal.modal-lg{max-width:720px;}
.modal-head{background:var(--azul);color:#fff;padding:13px 17px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;}
.modal-head h3{font-size:13px;}.modal-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
.modal-body{padding:17px;}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--borde);}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.section-head h2{font-size:15px;font-weight:700;color:var(--azul);}
.inner-tabs{display:flex;gap:0;border-bottom:2px solid var(--borde);margin-bottom:14px;}
.inner-tab{background:none;border:none;padding:7px 14px;font-size:12px;font-weight:600;color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;white-space:nowrap;}
.inner-tab.active{color:var(--azul2);border-bottom-color:var(--azul2);}
.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.filtros input,.filtros select{border:1px solid var(--borde);border-radius:6px;padding:5px 9px;font-size:12px;font-family:inherit;background:#fff;}
.alerta-mtto{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;margin-bottom:6px;border-left:4px solid;}
.alerta-mtto.vencida{background:var(--rojobg);border-color:var(--rojo);}.alerta-mtto.proxima{background:var(--amarbg);border-color:var(--amarillo);}
.alerta-mtto.ok{background:var(--verdebg);border-color:var(--verde);}
.alerta-mtto .ico{font-size:16px;flex-shrink:0;}.alerta-mtto .info{flex:1;}
.alerta-mtto .info .nombre{font-weight:700;font-size:12px;}.alerta-mtto .info .detalle{font-size:11px;color:var(--txt2);}
.usd-box{background:var(--azulbg);border:1px solid #BFDBFE;border-radius:6px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;}
.usd-box .usd-lbl{font-size:11px;color:var(--azul2);font-weight:700;}.usd-box .usd-val{font-size:16px;font-weight:800;color:var(--azul);}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.toggle-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;}
.toggle-row label{font-size:12px;font-weight:600;color:var(--txt1);cursor:pointer;}
.loading{text-align:center;padding:40px;color:var(--txt3);}
.spinner{width:30px;height:30px;border:3px solid var(--borde);border-top-color:var(--azul2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:7px;}
.toast{padding:9px 14px;border-radius:7px;font-size:12px;font-weight:600;box-shadow:0 4px 12px #0003;animation:slideIn .2s ease;max-width:320px;}
.toast.ok{background:var(--verde);color:#fff;}.toast.err{background:var(--rojo);color:#fff;}.toast.info{background:var(--azul);color:#fff;}
@keyframes slideIn{from{transform:translateX(20px);opacity:0;}}
.empty{text-align:center;padding:30px 16px;color:var(--txt3);}.empty .ico{font-size:32px;margin-bottom:8px;}
.qr-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px;}
.qr-container{background:#fff;padding:16px;border-radius:10px;border:1px solid var(--borde);}
.qr-info{text-align:center;}.qr-info .qr-codigo{font-size:18px;font-weight:800;color:var(--azul);letter-spacing:2px;}
.qr-info .qr-desc{font-size:12px;color:var(--txt2);margin-top:4px;}.qr-actions{display:flex;gap:8px;}
/* MODULO MANTENIMIENTO */
#mtto-container .steps{display:flex;gap:0;margin-bottom:20px;}
#mtto-container .step{flex:1;padding:10px 16px;background:var(--card);border:1px solid var(--borde);font-size:12px;font-weight:600;color:var(--txt3);border-right:none;}
#mtto-container .step:first-child{border-radius:8px 0 0 8px;}#mtto-container .step:last-child{border-radius:0 8px 8px 0;border-right:1px solid var(--borde);}
#mtto-container .step.active{background:var(--azul2);color:#fff;border-color:var(--azul2);}
#mtto-container .step.done{background:var(--verde);color:#fff;border-color:var(--verde);}
#mtto-container .step .num{display:inline-block;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.25);text-align:center;line-height:20px;font-size:11px;margin-right:6px;}
#mtto-container .tipo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:16px 0;}
#mtto-container .tipo-btn{border:2px solid var(--borde);background:var(--card);border-radius:10px;padding:16px;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit;width:100%;display:block;}
#mtto-container .tipo-btn:hover{border-color:var(--azul2);background:var(--fondo);}
#mtto-container .tipo-btn.selected{border-color:var(--azul2);background:#EFF6FF;}
#mtto-container .tipo-btn.selected-amber{border-color:var(--amber);background:#FFFBEB;}
#mtto-container .tipo-btn .ico{font-size:22px;margin-bottom:8px;display:block;}
#mtto-container .tipo-btn .titulo{font-size:13px;font-weight:700;color:var(--txt1);}
#mtto-container .tipo-btn .sub{font-size:11px;color:var(--txt3);margin-top:3px;}
#mtto-container .rep-row{display:grid;grid-template-columns:3fr 80px 100px 36px;gap:8px;align-items:center;margin-bottom:6px;}
#mtto-container .rep-row input{border:1px solid var(--borde);border-radius:5px;padding:6px 8px;font-size:12px;font-family:inherit;}
#mtto-container .usd-box{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;}
#mtto-container .usd-box .lbl{font-size:11px;color:var(--azul2);font-weight:700;}
#mtto-container .usd-box .val{font-size:18px;font-weight:800;color:var(--azul);}
#mtto-container .sem{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;}
#mtto-container .sem-ok{background:var(--verdebg);color:var(--verde);}
#mtto-container .sem-warn{background:#FEF9C3;color:#854D0E;}
#mtto-container .sem-rojo{background:var(--rojobg);color:var(--rojo);}
#mtto-container .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
#mtto-container .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
#mtto-container .span2{grid-column:span 2;}
#mtto-container .hidden{display:none !important;}
#mtto-container input.calc{background:#F8FAFC;font-weight:700;color:var(--azul);}
#mtto-container .card-title{font-size:13px;font-weight:700;color:var(--azul);margin-bottom:14px;}
#mtto-container .fg{display:flex;flex-direction:column;gap:4px;}
#mtto-container .fg label{font-size:11px;font-weight:700;color:var(--txt2);}
#mtto-container .fg input,#mtto-container .fg select,#mtto-container .fg textarea{border:1px solid var(--borde);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;background:#fff;}
#mtto-container .fg .hint{font-size:10px;color:var(--txt3);}
#mtto-container .main{max-width:100%;margin:0;padding:0;}
::-webkit-scrollbar{width:6px;height:6px;}::-webkit-scrollbar-track{background:var(--fondo);}::-webkit-scrollbar-thumb{background:var(--borde);border-radius:3px;}
</style>

<body>
<div class="app" id="app">
  <div class="loading"><div class="spinner"></div><div id="load-msg">Iniciando...</div></div>
</div>
<div class="toast-wrap" id="toasts"></div>
<template id="mtto-template">
<div id="mtto-wrap">
<div class="main">

  <!-- PASO 1: Seleccionar herramienta y tipo -->
  <div id="paso1">
    <div class="steps">
      <div class="step active"><span class="num">1</span>Herramienta y tipo</div>
      <div class="step"><span class="num">2</span>Datos de reparación</div>
      <div class="step"><span class="num">3</span>Confirmación</div>
    </div>

    <div class="card">
      <div class="card-title">1. Seleccioná la herramienta</div>
      <div class="fg">
        <label>Herramienta a reparar *</label>
        <select id="sel-her">
          <option value="">Cargando herramientas...</option>
        </select>
      </div>
      <div id="her-info" class="hidden" style="margin-top:10px;background:var(--fondo);border-radius:8px;padding:10px 14px;font-size:12px"></div>
    </div>

    <div class="card">
      <div class="card-title">2. Tipo de intervención</div>
      <div class="tipo-grid">
        <button class="tipo-btn" id="tipo-interna" onclick="selTipo('interna')">
          <span class="ico">🔧</span>
          <div class="titulo">Reparación Interna</div>
          <div class="sub">Almacén ISL — Ángel Gómez<br>Registra horas y repuestos</div>
        </button>
        <button class="tipo-btn" id="tipo-externa" onclick="selTipo('externa')">
          <span class="ico">🏭</span>
          <div class="titulo">Reparación Externa</div>
          <div class="sub">Service externo con remito ISL<br>Presupuesto → factura → USD</div>
        </button>
        <button class="tipo-btn" id="tipo-espera" onclick="selTipo('espera')">
          <span class="ico">⏸</span>
          <div class="titulo">Sin reparar por ahora</div>
          <div class="sub">Queda en Almacén ISL<br>Registra motivo y fecha revisión</div>
        </button>
      </div>
      <div style="text-align:right;margin-top:8px">
        <button class="btn btn-pri" onclick="irPaso2()">Continuar →</button>
      </div>
    </div>
  </div>

  <!-- PASO 2A: Reparación Interna -->
  <div id="paso2-interna" class="hidden">
    <div class="steps">
      <div class="step done"><span class="num">✓</span>Herramienta y tipo</div>
      <div class="step active"><span class="num">2</span>Reparación interna</div>
      <div class="step"><span class="num">3</span>Confirmación</div>
    </div>
    <div id="her-info-2a" class="card" style="background:#EFF6FF;border-color:#BFDBFE"></div>
    <div class="card">
      <div class="card-title">Datos de la reparación interna</div>
      <div class="grid2">
        <div class="fg span2">
          <label>Diagnóstico / descripción de la falla *</label>
          <textarea id="ri-diag" placeholder="Describí el problema detectado..."></textarea>
        </div>
        <div class="fg">
          <label>Fecha inicio</label>
          <input type="date" id="ri-fecha-ini">
        </div>
        <div class="fg">
          <label>Fecha fin</label>
          <input type="date" id="ri-fecha-fin">
        </div>
        <div class="fg">
          <label>Responsable</label>
          <input id="ri-resp" value="Ángel Gómez">
        </div>
        <div class="fg">
          <label>Estado</label>
          <select id="ri-estado">
            <option>En reparación</option>
            <option>Reparada</option>
            <option>Sin reparación — dar de baja</option>
          </select>
        </div>
      </div>

      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--borde)">
        <div class="card-title">Mano de obra</div>
        <div class="grid3">
          <div class="fg">
            <label>Horas dedicadas</label>
            <input type="number" id="ri-horas" placeholder="0" min="0" step="0.5" oninput="calcInterna()">
          </div>
          <div class="fg">
            <label>Costo por hora ($)</label>
            <input type="number" id="ri-costo-hh" placeholder="0" min="0" oninput="calcInterna()">
          </div>
          <div class="fg">
            <label>Subtotal MO</label>
            <input class="calc" id="ri-subtot-mo" readonly placeholder="$0">
          </div>
        </div>
      </div>

      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--borde)">
        <div class="card-title">Repuestos utilizados</div>
        <div style="display:grid;grid-template-columns:3fr 80px 100px 36px;gap:8px;margin-bottom:6px">
          <span style="font-size:11px;font-weight:700;color:var(--txt2)">Descripción</span>
          <span style="font-size:11px;font-weight:700;color:var(--txt2)">Cant.</span>
          <span style="font-size:11px;font-weight:700;color:var(--txt2)">Costo unit. $</span>
          <span></span>
        </div>
        <div id="rep-lista"></div>
        <button class="btn btn-sec btn-sm" onclick="addRepuesto()" style="margin-top:6px">+ Agregar repuesto</button>
        <div style="margin-top:10px">
          <div class="usd-box">
            <span class="lbl">💰 Costo total (MO + repuestos)</span>
            <span class="val" id="ri-total">$0</span>
          </div>
        </div>
      </div>

      <div class="fg" style="margin-top:14px">
        <label>Observaciones</label>
        <textarea id="ri-obs" placeholder="Notas adicionales..."></textarea>
      </div>

      <div style="display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--borde)">
        <button class="btn btn-sec" onclick="volverPaso1()">← Volver</button>
        <button class="btn btn-verde" onclick="guardarInterna()">✓ Guardar reparación interna</button>
      </div>
    </div>
  </div>

  <!-- PASO 2B: Reparación Externa -->
  <div id="paso2-externa" class="hidden">
    <div class="steps">
      <div class="step done"><span class="num">✓</span>Herramienta y tipo</div>
      <div class="step active"><span class="num">2</span>Reparación externa</div>
      <div class="step"><span class="num">3</span>Confirmación</div>
    </div>
    <div id="her-info-2b" class="card" style="background:#EFF6FF;border-color:#BFDBFE"></div>
    <div class="card">
      <div class="card-title">Datos del service externo</div>
      <div class="grid2">
        <div class="fg span2">
          <label>Diagnóstico / descripción de la falla *</label>
          <textarea id="re-diag" placeholder="Describí el problema detectado..."></textarea>
        </div>
        <div class="fg">
          <label>Service externo *</label>
          <input id="re-service" placeholder="Nombre del taller">
        </div>
        <div class="fg">
          <label>Fecha de envío</label>
          <input type="date" id="re-fecha-env">
        </div>
        <div class="fg">
          <label>N° Presupuesto</label>
          <input id="re-nro-presup" placeholder="N° del taller">
        </div>
        <div class="fg">
          <label>Monto presupuesto ($)</label>
          <input type="number" id="re-monto-presup" placeholder="0" oninput="calcSemaforo()">
        </div>
        <div id="re-semaforo" class="span2 hidden"></div>
        <div class="fg">
          <label>Estado presupuesto</label>
          <select id="re-est-presup">
            <option>Pendiente</option>
            <option>Aprobado</option>
            <option>Rechazado</option>
          </select>
        </div>
        <div class="fg">
          <label>Fecha aprobación</label>
          <input type="date" id="re-fecha-apro">
        </div>
      </div>

      <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--borde)">
        <div class="card-title">Factura (completar al recibir)</div>
        <div class="grid2">
          <div class="fg">
            <label>N° Factura del taller</label>
            <input id="re-nro-fact" placeholder="0001-00012345">
          </div>
          <div class="fg">
            <label>Monto factura ($)</label>
            <input type="number" id="re-monto-fact" placeholder="0" oninput="calcUSD()">
          </div>
          <div class="fg">
            <label>Fecha factura</label>
            <input type="date" id="re-fecha-fact" onchange="buscarTC(this.value)">
          </div>
          <div class="fg">
            <label>TC BNA Divisa Vendedor</label>
            <input type="number" id="re-tc" placeholder="Buscando automático..." oninput="calcUSD()">
            <span class="hint" id="re-tc-hint"></span>
          </div>
          <div class="span2 hidden" id="re-usd-wrap">
            <div class="usd-box">
              <span class="lbl">💵 Costo reparación en USD</span>
              <span class="val" id="re-usd-val">—</span>
            </div>
          </div>
        </div>
      </div>

      <div class="grid2" style="margin-top:14px">
        <div class="fg">
          <label>Estado reparación</label>
          <select id="re-estado">
            <option>Presupuesto enviado</option>
            <option>En reparación</option>
            <option>Reparada</option>
            <option>Sin reparación — dar de baja</option>
          </select>
        </div>
        <div class="fg">
          <label>Fecha retorno</label>
          <input type="date" id="re-fecha-ret">
        </div>
        <div class="fg span2">
          <label>Observaciones</label>
          <textarea id="re-obs"></textarea>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--borde)">
        <button class="btn btn-sec" onclick="volverPaso1()">← Volver</button>
        <button class="btn btn-verde" onclick="guardarExterna()">✓ Guardar reparación externa</button>
      </div>
    </div>
  </div>

  <!-- PASO 2C: En espera -->
  <div id="paso2-espera" class="hidden">
    <div class="steps">
      <div class="step done"><span class="num">✓</span>Herramienta y tipo</div>
      <div class="step active"><span class="num">2</span>Sin reparar por ahora</div>
      <div class="step"><span class="num">3</span>Confirmación</div>
    </div>
    <div id="her-info-2c" class="card" style="background:#FFFBEB;border-color:#FDE68A"></div>
    <div class="card">
      <div class="card-title">Registrar herramienta en espera</div>
      <div class="grid2">
        <div class="fg span2">
          <label>Diagnóstico / descripción de la falla *</label>
          <textarea id="esp-diag" placeholder="Describí el problema detectado..."></textarea>
        </div>
        <div class="fg span2">
          <label>Motivo por el que no se repara ahora *</label>
          <select id="esp-motivo">
            <option value="">— Seleccionar —</option>
            <option>Esperando presupuesto</option>
            <option>Esperando repuesto</option>
            <option>Decisión pendiente — costo elevado</option>
            <option>Sin fondos por ahora</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="fg">
          <label>Fecha estimada de revisión</label>
          <input type="date" id="esp-fecha-rev">
          <span class="hint">Cuándo se vuelve a evaluar la decisión</span>
        </div>
        <div class="fg">
          <label>Responsable del seguimiento</label>
          <input id="esp-resp" value="David Tesido">
        </div>
        <div class="fg span2">
          <label>Observaciones adicionales</label>
          <textarea id="esp-obs" placeholder="Repuesto a conseguir, presupuesto recibido, etc."></textarea>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--borde)">
        <button class="btn btn-sec" onclick="volverPaso1()">← Volver</button>
        <button class="btn btn-amber" onclick="guardarEspera()">⏸ Registrar — dejar en espera</button>
      </div>
    </div>
  </div>

  <!-- PASO 3: Confirmación -->
  <div id="paso3" class="hidden">
    <div class="steps">
      <div class="step done"><span class="num">✓</span>Herramienta y tipo</div>
      <div class="step done"><span class="num">✓</span>Datos de reparación</div>
      <div class="step active"><span class="num">3</span>Confirmación</div>
    </div>
    <div class="card" style="text-align:center;padding:40px">
      <div style="font-size:48px;margin-bottom:16px" id="conf-ico">✅</div>
      <div style="font-size:18px;font-weight:800;color:var(--verde);margin-bottom:8px" id="conf-titulo">Registrado correctamente</div>
      <div style="font-size:13px;color:var(--txt2);margin-bottom:24px" id="conf-detalle"></div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-pri" onclick="nuevaRep()">+ Nueva reparación</button>
        <button class="btn btn-sec" onclick="window.location.href='ISL-GestionHerramientas-App-v3.html'">Volver a la app</button>
      </div>
    </div>
  </div>

  <!-- HISTORIAL -->
  <div class="card" id="historial-card">
    <div class="card-title" style="display:flex;justify-content:space-between">
      <span>📋 Historial de mantenimiento</span>
      <button class="btn btn-sec btn-sm" onclick="cargarHistorial()">↺ Actualizar</button>
    </div>
    <div id="historial-content">
      <div style="text-align:center;padding:20px;color:var(--txt3)">
        <div class="spinner"></div>Cargando...
      </div>
    </div>
  </div>

</div>
</div>
</template>

// API via Apps Script
async function shGet(range) {
  const r = await fetch(APPS_SCRIPT_URL + "?range=" + encodeURIComponent(range), {
    redirect: "follow",
    mode: "cors"
  });
  if (!r.ok) throw new Error("GET " + r.status);
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || "Error Apps Script");
  return d.values || [];
}
async function shApp(sheet, values) {
  const payload = encodeURIComponent(JSON.stringify({action:"append",sheet:sheet,values:values}));
  const r = await fetch(APPS_SCRIPT_URL + "?payload=" + payload, {redirect:"follow",mode:"cors"});
  if (!r.ok) throw new Error("APP " + r.status);
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || "Error Apps Script");
  return d;
}
async function shUpd(range, values) {
  const payload = encodeURIComponent(JSON.stringify({action:"update",range:range,values:values}));
  const r = await fetch(APPS_SCRIPT_URL + "?payload=" + payload, {redirect:"follow",mode:"cors"});
  if (!r.ok) throw new Error("UPD " + r.status);
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || "Error Apps Script");
  return d;
}

// HELPERS
const uid=()=>Date.now().toString(36).toUpperCase()+Math.random().toString(36).substring(2,5).toUpperCase();
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+(String(d.getMonth()+1).padStart(2,"0"))+"-"+(String(d.getDate()).padStart(2,"0"));};
const hora=()=>new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
const fmtARS=n=>n?"$"+Number(n).toLocaleString("es-AR"):"—";
const fmtUSD=n=>n?"U$S "+Number(n).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2}):"—";
function fmtFecha(val){
  if(!val)return"—";
  if(typeof val==="string"&&val.includes("/"))return val;
  if(typeof val==="string"&&val.includes("-")){const[y,m,d]=val.split("-");return`${d}/${m}/${y}`;}
  const n=Number(val);
  if(!isNaN(n)&&n>1000){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});}
  return val;
}
function rowsToObj(rows){if(!rows.length)return[];const[head,...data]=rows;return data.filter(r=>r[0]&&r[0].toString().trim()!=="").map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]||""])));}
function toast(msg,tipo="ok"){const wrap=document.getElementById("toasts");const el=document.createElement("div");el.className=`toast ${tipo}`;el.textContent=msg;wrap.appendChild(el);setTimeout(()=>el.remove(),3500);}
function estadoBadge(e){const m={"Operativa":"b-verde","Entregada-Acta":"b-azul","Pendiente diagnóstico":"b-naranja","En reparación-Almacén":"b-naranja","En espera — sin reparar":"b-amarillo","En service externo":"b-naranja","En tránsito":"b-gris","Baja":"b-rojo","Devuelta a proveedor":"b-rojo"};return`<span class="badge ${m[e]||"b-gris"}">${e||"—"}</span>`;}
function diasHastaMtto(p){if(!p)return null;const parts=p.split("/");if(parts.length!==3)return null;const f=new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);return Math.ceil((f-new Date())/(1000*60*60*24));}
function alertaMttoClass(d){if(d===null)return"";if(d<0)return"vencida";if(d<=15)return"proxima";return"ok";}
function alertaMttoIco(d){if(d===null)return"";if(d<0)return"🔴";if(d<=15)return"🟡";return"🟢";}

async function cargarTodo(){
  const hojas=[
    {n:"Herramientas",r:"Herramientas!A:X",k:"herramientas"},
    {n:"Movimientos",r:"Movimientos!A:L",k:"movimientos"},
    {n:"Actas",r:"Actas!A:P",k:"actas"},
    {n:"Nodos",r:"Nodos!A:F",k:"nodos"},
    {n:"Personas",r:"Personas!A:G",k:"personas"},
    {n:"ControlHyS",r:"ControlHyS!A:J",k:"controlHyS"},
    {n:"Novedades",r:"Novedades!A:L",k:"novedades"},
    {n:"Mantenimiento",r:"Mantenimiento!A:X",k:"mantenimiento"},
    {n:"Repuestos",r:"Repuestos!A:H",k:"repuestos"},
    {n:"Alertas",r:"Alertas!A:I",k:"alertasMtto"},
  ];
  for(let i=0;i<hojas.length;i++){
    const h=hojas[i];
    setLoadMsg(`Cargando ${i+1}/${hojas.length}: <b>${h.n}</b>...`);
    try{const rows=await shGet(h.r);S.data[h.k]=rowsToObj(rows);}
    catch(e){console.error("Error "+h.n+":",e);S.data[h.k]=[];}
  }
  S.connected=true;
}

async function fetchTCBNA(fecha){
  try{
    const r=await fetch(`https://api.argentinadatos.com/v1/cotizaciones/dolares/oficial/${fecha}`);
    if(r.ok){const d=await r.json();if(d&&d.venta)return Number(d.venta);}
    const r2=await fetch("https://api.argentinadatos.com/v1/cotizaciones/dolares/oficial");
    if(r2.ok){const hist=await r2.json();if(Array.isArray(hist)&&hist.length){const f=hist.filter(e=>e.fecha<=fecha).sort((a,b)=>b.fecha.localeCompare(a.fecha));if(f.length)return Number(f[0].venta);}}
    return null;
  }catch{return null;}
}

var mHer = [], mTipo = "", mCod = "", mReps = [];

function mFmtFecha(val) {
  if (!val) return "—";
  if (typeof val === "string" && val.includes("T")) {
    // ISO format: 2026-08-03T03:00:00.000Z
    var d = new Date(val);
    return d.toLocaleDateString("es-AR", {day:"2-digit",month:"2-digit",year:"numeric"});
  }
  if (typeof val === "string" && val.includes("/")) return val;
  if (typeof val === "string" && val.includes("-")) {
    var parts = val.split("-");
    return parts[2] + "/" + parts[1] + "/" + parts[0];
  }
  var n = Number(val);
  if (!isNaN(n) && n > 1000) {
    var d = new Date(Date.UTC(1899,11,30) + n*86400000);
    return d.toLocaleDateString("es-AR", {day:"2-digit",month:"2-digit",year:"numeric"});
  }
  return val;
}

async function mShGet(range) {
  var r = await fetch(APPS_SCRIPT_URL + "?range=" + encodeURIComponent(range), {
    redirect: "follow",
    mode: "cors"
  });
  if (!r.ok) throw new Error("GET " + r.status);
  var d = await r.json();
  if (!d.ok) throw new Error(d.error || "Error");
  return d.values || [];
}
async function mShApp(sheet, values) {
  var payload = encodeURIComponent(JSON.stringify({action:"append",sheet:sheet,values:values}));
  var r = await fetch(APPS_SCRIPT_URL + "?payload=" + payload, {redirect:"follow",mode:"cors"});
  var d = await r.json();
  if (!d.ok) throw new Error(d.error || "Error");
  return d;
}
async function mShUpd(range, values) {
  var payload = encodeURIComponent(JSON.stringify({action:"update",range:range,values:values}));
  var r = await fetch(APPS_SCRIPT_URL + "?payload=" + payload, {redirect:"follow",mode:"cors"});
  var d = await r.json();
  if (!d.ok) throw new Error(d.error || "Error");
  return d;
}

      mHer = S.data.herramientas;

      var rows = await mShGet("Herramientas!A:X");

  el.innerHTML = "<strong>" + her.Codigo + "</strong> — " + her.Descripcion +
    " | <span class='badge b-gris'>" + her.Categoria + "</span>" +
    " | Valor: <strong>" + fmtARS(her.ValorCompra) + "</strong>" +
    " | Estado: <strong>" + her.Estado + "</strong>";
}
function mSelTipo(t) {
  mTipo = t;
  ["tipo-interna","tipo-externa","tipo-espera"].forEach(function(id){ var el=document.getElementById(id); if(el) el.className="tipo-btn"; });
  var el = document.getElementById("tipo-" + t);
  if (el) el.className = t==="espera" ? "tipo-btn selected-amber" : "tipo-btn selected";
}
window.selTipo = mSelTipo;
function mIrPaso2() {
  var sel = document.getElementById("sel-her");
  mCod = sel ? sel.value : "";
  if (!mCod) { toast("Selecciona una herramienta","err"); return; }
  if (!mTipo) { toast("Selecciona el tipo","err"); return; }
  var her = mHer.find(function(h){ return h.Codigo===mCod; });
  var info = "<strong>" + mCod + " — " + (her?her.Descripcion:"") + "</strong>" +
    " | " + (her?her.Categoria:"") + " | Valor: " + fmtARS(her?her.ValorCompra:0) +
    " | Limite rep.: " + fmtARS(Number(her&&her.ValorCompra||0)*0.7);
  mHide("paso1");
  if (mTipo==="interna") {
    var ei=document.getElementById("her-info-2a"); if(ei) ei.innerHTML=info;
    var fi=document.getElementById("ri-fecha-ini"); if(fi) fi.value=hoy();
    mInitReps(); mShow("paso2-interna");
  } else if (mTipo==="externa") {
    var ei=document.getElementById("her-info-2b"); if(ei) ei.innerHTML=info;
    var fe=document.getElementById("re-fecha-env"); if(fe) fe.value=hoy();
    mShow("paso2-externa");
  } else if (mTipo==="espera") {
    var ei=document.getElementById("her-info-2c"); if(ei) ei.innerHTML=info;
    mShow("paso2-espera");
  }
}
window.irPaso2 = mIrPaso2;
function mVolverPaso1() { mHide("paso2-interna"); mHide("paso2-externa"); mHide("paso2-espera"); mShow("paso1"); }
window.volverPaso1 = mVolverPaso1;
function mInitReps() { mReps=[]; mRenderReps(); }
function mAddRep() { mReps.push({desc:"",cant:1,costo:0}); mRenderReps(); }
window.addRepuesto = mAddRep;
function mRenderReps() {
  var el=document.getElementById("rep-lista"); if(!el) return;
  el.innerHTML = mReps.map(function(r,i){
    return "<div class='rep-row'>" +
      "<input placeholder='Descripcion' value='" + r.desc + "' onchange='mReps[" + i + "].desc=this.value'>" +
      "<input type='number' value='" + r.cant + "' min='1' onchange='mReps[" + i + "].cant=Number(this.value);mCalcInt()'>" +
      "<input type='number' value='" + r.costo + "' min='0' onchange='mReps[" + i + "].costo=Number(this.value);mCalcInt()'>" +
      "<button class='btn btn-rojo btn-sm' onclick='mReps.splice(" + i + ",1);mRenderReps();mCalcInt()'>x</button>" +
      "</div>";
  }).join("");
}
window.renderRepuestos = mRenderReps;
function mCalcInt() {
  var h=Number((document.getElementById("ri-horas")||{value:0}).value||0);
  var c=Number((document.getElementById("ri-costo-hh")||{value:0}).value||0);
  var mo=h*c;
  var rT=mReps.reduce(function(s,r){return s+Number(r.cant||0)*Number(r.costo||0);},0);
  var tot=mo+rT;
  var em=document.getElementById("ri-subtot-mo"); if(em) em.value=fmtARS(mo);
  var et=document.getElementById("ri-total"); if(et) et.textContent=fmtARS(tot);
}
window.calcInterna = mCalcInt;
function mCalcSem() {
  var m=Number((document.getElementById("re-monto-presup")||{value:0}).value||0);
  var her=mHer.find(function(h){return h.Codigo===mCod;});
  var v=Number(her?her.ValorCompra||0:0);
  var el=document.getElementById("re-semaforo"); if(!el) return;
  if (!m||!v) { el.classList.add("hidden"); return; }
  var p=m/v;
  el.innerHTML = p<0.4?"<span class='sem sem-ok'>Viable — "+Math.round(p*100)+"%</span>":p<0.7?"<span class='sem sem-warn'>Evaluar — "+Math.round(p*100)+"%</span>":"<span class='sem sem-rojo'>Alto costo — "+Math.round(p*100)+"%</span>";
  el.classList.remove("hidden");
}
window.calcSemaforo = mCalcSem;
function mCalcUSD() {
  var m=Number((document.getElementById("re-monto-fact")||{value:0}).value||0);
  var tc=Number((document.getElementById("re-tc")||{value:0}).value||0);
  if (m&&tc) {
    var usd=(m/tc).toFixed(2);
    var ev=document.getElementById("re-usd-val"); if(ev) ev.textContent=fmtUSD(usd);
    var ew=document.getElementById("re-usd-wrap"); if(ew) ew.classList.remove("hidden");
  }
}
window.calcUSD = mCalcUSD;
async function mBuscarTC(fecha) {
  if(!fecha) return;
  var el=document.getElementById("re-tc"); var hint=document.getElementById("re-tc-hint");
  if(el){el.value="";el.placeholder="Buscando...";}
  try {
    var r=await fetch("https://api.argentinadatos.com/v1/cotizaciones/dolares/oficial/"+fecha);
    if(r.ok){var d=await r.json();if(d.venta){if(el){el.value=d.venta;el.placeholder="TC BNA";}if(hint)hint.textContent="TC BNA "+fecha+": $"+Number(d.venta).toLocaleString("es-AR");mCalcUSD();return;}}
    var r2=await fetch("https://api.argentinadatos.com/v1/cotizaciones/dolares/oficial");
    if(r2.ok){var hist=await r2.json();if(Array.isArray(hist)&&hist.length){var filt=hist.filter(function(e){return e.fecha<=fecha;}).sort(function(a,b){return b.fecha.localeCompare(a.fecha);});if(filt.length){if(el){el.value=filt[0].venta;el.placeholder="TC BNA";}if(hint)hint.textContent="TC ultimo dia habil ("+filt[0].fecha+"): $"+Number(filt[0].venta).toLocaleString("es-AR");mCalcUSD();return;}}}
    if(el) el.placeholder="No encontrado — ingresalo manualmente";
  } catch(e) { if(el) el.placeholder="Error"; }
}
window.buscarTC = mBuscarTC;
async function mGuardarInterna() {
  var diag=(document.getElementById("ri-diag")||{value:""}).value.trim();
  if(!diag){toast("Completa el diagnostico","err");return;}
  var her=mHer.find(function(h){return h.Codigo===mCod;});
  var horas=Number((document.getElementById("ri-horas")||{value:0}).value||0);
  var chh=Number((document.getElementById("ri-costo-hh")||{value:0}).value||0);
  var mo=horas*chh;
  var rT=mReps.reduce(function(s,r){return s+Number(r.cant||0)*Number(r.costo||0);},0);
  var tot=mo+rT;
  var estado=(document.getElementById("ri-estado")||{value:""}).value;
  var fi=(document.getElementById("ri-fecha-ini")||{value:hoy()}).value||hoy();
  var ff=(document.getElementById("ri-fecha-fin")||{value:""}).value;
  var resp=(document.getElementById("ri-resp")||{value:"Angel Gomez"}).value;
  var obs=(document.getElementById("ri-obs")||{value:""}).value;
  try {
    await mShApp("Mantenimiento",[[uid(),mCod,her?her.Descripcion||"":"","Interno",diag,fi,ff,resp,"","","","","","","","","","",estado,horas,chh,mo,tot,obs]]);
    for(var i=0;i<mReps.length;i++){if(mReps[i].desc)await mShApp("Repuestos",[[uid(),mCod,hoy(),mReps[i].desc,mReps[i].cant,mReps[i].costo,mReps[i].cant*mReps[i].costo,""]]);}
    var idx=mHer.findIndex(function(h){return h.Codigo===mCod;});
    if(idx>=0){var ne=estado==="Reparada"?"Operativa":estado.indexOf("baja")>=0?"Baja":"En reparacion-Almacen";await mShUpd("Herramientas!L"+(idx+2),[[ne]]);}
    mMostrarConf("OK","Reparacion interna registrada",mCod+" Costo: "+fmtARS(tot));
  } catch(e){toast("Error: "+e.message,"err");}
}
window.guardarInterna = mGuardarInterna;
async function mGuardarExterna() {
  var diag=(document.getElementById("re-diag")||{value:""}).value.trim();
  var service=(document.getElementById("re-service")||{value:""}).value.trim();
  if(!diag){toast("Completa el diagnostico","err");return;}
  if(!service){toast("Ingresa el service","err");return;}
  var her=mHer.find(function(h){return h.Codigo===mCod;});
  var mFact=(document.getElementById("re-monto-fact")||{value:""}).value;
  var tc=(document.getElementById("re-tc")||{value:""}).value;
  var usd=(mFact&&tc)?(Number(mFact)/Number(tc)).toFixed(2):"";
  var estado=(document.getElementById("re-estado")||{value:""}).value;
  try {
    await mShApp("Mantenimiento",[[uid(),mCod,her?her.Descripcion||"":"","Externo",diag,
      (document.getElementById("re-fecha-env")||{value:hoy()}).value||hoy(),"",service,service,
      (document.getElementById("re-nro-presup")||{value:""}).value,
      (document.getElementById("re-monto-presup")||{value:""}).value,
      (document.getElementById("re-est-presup")||{value:""}).value,
      (document.getElementById("re-fecha-apro")||{value:""}).value,
      (document.getElementById("re-nro-fact")||{value:""}).value,
      mFact,tc,usd,(document.getElementById("re-fecha-ret")||{value:""}).value,
      estado,"","","","",(document.getElementById("re-obs")||{value:""}).value]]);
    var idx=mHer.findIndex(function(h){return h.Codigo===mCod;});
    if(idx>=0){var ne=estado==="Reparada"?"Operativa":estado.indexOf("baja")>=0?"Baja":"En service externo";await mShUpd("Herramientas!L"+(idx+2),[[ne]]);}
    mMostrarConf("OK","Reparacion externa registrada",mCod+" Service: "+service);
  } catch(e){toast("Error: "+e.message,"err");}
}
window.guardarExterna = mGuardarExterna;
async function mGuardarEspera() {
  var diag=(document.getElementById("esp-diag")||{value:""}).value.trim();
  var motivo=(document.getElementById("esp-motivo")||{value:""}).value;
  if(!diag){toast("Completa el diagnostico","err");return;}
  if(!motivo){toast("Selecciona el motivo","err");return;}
  var her=mHer.find(function(h){return h.Codigo===mCod;});
  var obs=(document.getElementById("esp-obs")||{value:""}).value;
  var fechaRev=(document.getElementById("esp-fecha-rev")||{value:""}).value;
  var resp=(document.getElementById("esp-resp")||{value:"David Tesido"}).value;
  try {
    await mShApp("Mantenimiento",[[uid(),mCod,her?her.Descripcion||"":"","En espera",diag,hoy(),"",resp,"","","","","","","","","","","En espera: "+motivo,"","","","",obs+(fechaRev?" | Revision: "+fechaRev:"")]]);
    var idx=mHer.findIndex(function(h){return h.Codigo===mCod;});
    if(idx>=0){await mShUpd("Herramientas!L"+(idx+2),[["En espera — sin reparar"]]);await mShUpd("Herramientas!R"+(idx+2),[[("["+hoy()+"] En espera: "+motivo+". "+obs).trim()]]);}
    mMostrarConf("ESPERA","Herramienta en espera",mCod+" Motivo: "+motivo);
  } catch(e){toast("Error: "+e.message,"err");}
}
window.guardarEspera = mGuardarEspera;
function mMostrarConf(ico,titulo,detalle) {
  ["paso2-interna","paso2-externa","paso2-espera"].forEach(mHide);
  var ei=document.getElementById("conf-ico"); if(ei) ei.textContent=ico;
  var et=document.getElementById("conf-titulo"); if(et) et.textContent=titulo;
  var ed=document.getElementById("conf-detalle"); if(ed) ed.textContent=detalle;
  mShow("paso3"); mCargarHistorial();
}
window.mostrarConfirmacion = mMostrarConf;
function mNuevaRep() { mTipo="";mCod="";mReps=[];document.querySelectorAll(".tipo-btn").forEach(function(b){b.className="tipo-btn";});mHide("paso3");mShow("paso1");mCargarHer(); }
window.nuevaRep = mNuevaRep;
async function mCargarHistorial() {
  var el=document.getElementById("historial-content"); if(!el) return;
  el.innerHTML="<div style='text-align:center;padding:20px'><div class='spinner'></div>Cargando...</div>";
  try {
    var rows=await mShGet("Mantenimiento!A:X");
    if(rows.length<=1){el.innerHTML="<div style='text-align:center;padding:20px'>Sin registros</div>";return;}
    var head=rows[0];
    var items=rows.slice(1).filter(function(r){return r[0]&&r[0].toString().trim()!=="";}).map(function(r){return Object.fromEntries(head.map(function(k,i){return [k,r[i]||""];}));}).reverse().slice(0,20);
    el.innerHTML="<table><tr><th>Fecha</th><th>Herramienta</th><th>Tipo</th><th>Estado</th><th>Diagnostico</th><th>Costo</th></tr>"+
      items.map(function(m){
        return "<tr><td style='white-space:nowrap;font-size:11px'>"+mFmtFecha(m.FechaInicio||"")+"</td>"+
          "<td><strong>"+m.CodigoHerramienta+"</strong></td>"+
          "<td><span class='badge "+(m.Tipo==="Externo"?"b-azul":m.Tipo==="Interno"?"b-gris":"b-amarillo")+"'>"+( m.Tipo||"—")+"</span></td>"+
          "<td style='font-size:11px'>"+(m.EstadoReparacion||"—")+"</td>"+
          "<td style='font-size:11px'>"+(m.Diagnostico||"").substring(0,60)+"</td>"+
          "<td style='font-weight:700'>"+(m.CostoTotalInterno?fmtARS(m.CostoTotalInterno):m.MontoFactura?fmtARS(m.MontoFactura):"—")+"</td></tr>";
      }).join("")+"</table>";
  } catch(e){el.innerHTML="<div style='text-align:center;padding:20px;color:var(--rojo)'>Error: "+e.message+"</div>";}
}
window.cargarHistorial = mCargarHistorial;
function initMtto() {
  mTipo="";mCod="";mReps=[];
  var wrap=document.getElementById("mtto-container");
  var tmpl=document.getElementById("mtto-template");
  if(wrap&&tmpl) wrap.innerHTML=tmpl.innerHTML;
  ["paso2-interna","paso2-externa","paso2-espera","paso3"].forEach(mHide);
  mShow("paso1");
  // Pequeño delay para asegurar que el DOM está listo
  setTimeout(function() {
    mCargarHer();
    mCargarHistorial();
  }, 100);
}
// ===== FIN MODULO MANTENIMIENTO =====

</script>
</body>
</html>
