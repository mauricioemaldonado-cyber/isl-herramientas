<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1A3A5C">
<title>ISL · Herramientas Manuales</title>
<style>
:root{--azul:#1A3A5C;--azul2:#2563A8;--azul3:#3B82C4;--azulbg:#EFF6FF;--acento:#F59E0B;--verde:#16A34A;--verdebg:#DCFCE7;--rojo:#DC2626;--rojobg:#FEE2E2;--naranja:#EA580C;--narbg:#FEF3C7;--amarillo:#CA8A04;--amarbg:#FEF9C3;--amber:#D97706;--fondo:#F1F5F9;--card:#FFFFFF;--borde:#CBD5E1;--txt1:#0F172A;--txt2:#475569;--txt3:#94A3B8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:system-ui,sans-serif;background:var(--fondo);color:var(--txt1);font-size:13px;}
.app{display:flex;flex-direction:column;height:100vh;}
.topbar{background:var(--azul);color:#fff;padding:0 16px;display:flex;align-items:stretch;height:52px;flex-shrink:0;}
.topbar-brand{display:flex;align-items:center;gap:8px;margin-right:16px;}
.topbar-brand img{height:34px;width:auto;background:#fff;padding:3px 6px;border-radius:4px;}
.topbar-brand .nombre{font-size:10px;color:#94A3B8;line-height:1.3;}
.topbar-nav{display:flex;flex:1;overflow-x:auto;}
.nav-btn{background:none;border:none;color:#94A3B8;padding:0 11px;font-size:11.5px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:all .15s;}
.nav-btn:hover{color:#fff;}.nav-btn.active{color:#fff;border-bottom-color:var(--acento);}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.conn-badge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700;}
.conn-badge.ok{background:var(--verdebg);color:var(--verde);}.conn-badge.err{background:var(--rojobg);color:var(--rojo);}
.topbar-link{color:#94A3B8;font-size:11px;text-decoration:none;padding:0 8px;display:flex;align-items:center;border-left:1px solid #2D4F6B;}
.topbar-link:hover{color:#fff;}
.main{flex:1;overflow-y:auto;padding:18px;}
.card{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:16px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--borde);border-radius:10px;padding:12px 14px;border-left:4px solid;}
.stat .val{font-size:26px;font-weight:800;line-height:1;margin:3px 0 2px;}
.stat .lbl{font-size:11px;color:var(--txt2);}
.tabla-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:var(--azul);color:#fff;padding:7px 9px;text-align:left;font-weight:700;font-size:11px;white-space:nowrap;}
td{padding:6px 9px;border-bottom:1px solid var(--fondo);vertical-align:top;}
tr:hover td{background:#F8FAFC;}.td-bold{font-weight:700;color:var(--azul);}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap;}
.b-verde{background:var(--verdebg);color:var(--verde);}.b-rojo{background:var(--rojobg);color:var(--rojo);}
.b-azul{background:var(--azulbg);color:var(--azul2);}.b-naranja{background:var(--narbg);color:var(--naranja);}
.b-gris{background:#F1F5F9;color:var(--txt2);}
.btn{border:none;border-radius:6px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-pri{background:var(--azul2);color:#fff;}.btn-sec{background:transparent;color:var(--azul2);border:1px solid var(--azul2);}
.btn-verde{background:var(--verde);color:#fff;}.btn-rojo{background:var(--rojo);color:#fff;}
.btn-xs{padding:3px 8px;font-size:11px;}
.form-grid{display:grid;gap:11px;}.form-grid.g2{grid-template-columns:1fr 1fr;}
.fg{display:flex;flex-direction:column;gap:3px;}.fg label{font-size:11px;font-weight:700;color:var(--txt2);}
.fg input,.fg select,.fg textarea{border:1px solid var(--borde);border-radius:6px;padding:6px 9px;font-size:12px;font-family:inherit;background:#fff;}
.fg textarea{resize:vertical;min-height:52px;}
.span2{grid-column:span 2;}
.form-section{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--azul);background:var(--azulbg);padding:5px 8px;border-radius:4px;margin-top:4px;}
.modal-bg{position:fixed;inset:0;background:#00000065;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px #0004;}
.modal-head{background:var(--azul);color:#fff;padding:13px 17px;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;}
.modal-head h3{font-size:13px;}.modal-close{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;}
.modal-body{padding:17px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--borde);}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.section-head h2{font-size:15px;font-weight:700;color:var(--azul);}
.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.filtros input,.filtros select{border:1px solid var(--borde);border-radius:6px;padding:5px 9px;font-size:12px;font-family:inherit;background:#fff;}
.inner-tabs{display:flex;gap:0;border-bottom:2px solid var(--borde);margin-bottom:14px;}
.inner-tab{background:none;border:none;padding:7px 14px;font-size:12px;font-weight:600;color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit;white-space:nowrap;}
.inner-tab.active{color:var(--azul2);border-bottom-color:var(--azul2);}
.loading{text-align:center;padding:40px;color:var(--txt3);}
.spinner{width:30px;height:30px;border:3px solid var(--borde);border-top-color:var(--azul2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast-wrap{position:fixed;bottom:18px;right:18px;z-index:200;display:flex;flex-direction:column;gap:7px;}
.toast{padding:9px 14px;border-radius:7px;font-size:12px;font-weight:600;box-shadow:0 4px 12px #0003;max-width:320px;}
.toast.ok{background:var(--verde);color:#fff;}.toast.err{background:var(--rojo);color:#fff;}.toast.info{background:var(--azul);color:#fff;}
.empty{text-align:center;padding:30px 16px;color:var(--txt3);}.empty .ico{font-size:32px;margin-bottom:8px;}
</style>
</head>
<body>
<div class="app" id="app"><div class="loading"><div class="spinner"></div><div id="load-msg">Iniciando...</div></div></div>
<div class="toast-wrap" id="toasts"></div>

let S={tab:"inventario",innerTab:"",connected:false,loading:false,
  data:{herramientas:[],movimientos:[],actas:[],nodos:[]},
  modal:null,filtros:{busqueda:"",categoria:"",estado:"",nodo:""}};

async function shGet(range){const r=await fetch(APPS_SCRIPT_URL+"?range="+encodeURIComponent(range),{redirect:"follow",mode:"cors"});const d=await r.json();if(!d.ok)throw new Error(d.error||"Error");return d.values||[];}
async function shApp(sheet,values){const payload=encodeURIComponent(JSON.stringify({action:"append",sheet:sheet,values:values}));const r=await fetch(APPS_SCRIPT_URL+"?payload="+payload,{redirect:"follow",mode:"cors"});const d=await r.json();if(!d.ok)throw new Error(d.error||"Error");return d;}
async function shUpd(range,values){const payload=encodeURIComponent(JSON.stringify({action:"update",range:range,values:values}));const r=await fetch(APPS_SCRIPT_URL+"?payload="+payload,{redirect:"follow",mode:"cors"});const d=await r.json();if(!d.ok)throw new Error(d.error||"Error");return d;}

const uid=()=>Date.now().toString(36).toUpperCase()+Math.random().toString(36).substring(2,5).toUpperCase();
const hoy=()=>{const d=new Date();return d.getFullYear()+"-"+(String(d.getMonth()+1).padStart(2,"0"))+"-"+(String(d.getDate()).padStart(2,"0"));};
const hora=()=>new Date().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
const fmtARS=n=>n?"$"+Number(n).toLocaleString("es-AR"):"—";
function fmtFecha(val){if(!val)return"—";if(typeof val==="string"&&val.includes("/"))return val;if(typeof val==="string"&&val.includes("-")){const[y,m,d]=val.split("-");return`${d}/${m}/${y}`;}const n=Number(val);if(!isNaN(n)&&n>1000){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"});}return val;}
function rowsToObj(rows){if(!rows.length)return[];const[head,...data]=rows;return data.filter(r=>r[0]&&r[0].toString().trim()!=="").map(r=>Object.fromEntries(head.map((k,i)=>[k,r[i]||""])));}
function toast(msg,tipo="ok"){const w=document.getElementById("toasts");const el=document.createElement("div");el.className=`toast ${tipo}`;el.textContent=msg;w.appendChild(el);setTimeout(()=>el.remove(),3500);}
function estadoBadge(e){const m={"Operativa":"b-verde","Entregada-Acta":"b-azul","En tránsito":"b-gris","Baja":"b-rojo","Devuelta a proveedor":"b-rojo"};return`<span class="badge ${m[e]||"b-gris"}">${e||"—"}</span>`;}
function setLoadMsg(msg){const el=document.getElementById("load-msg");if(el)el.innerHTML=msg;}

async function cargarTodo(){
  const hojas=[
    {n:"HerramientasManuales",r:"HerramientasManuales!A:Q",k:"herramientas"},
    {n:"MovimientosManuales",r:"MovimientosManuales!A:L",k:"movimientos"},
    {n:"ActasManuales",r:"ActasManuales!A:P",k:"actas"},
    {n:"Nodos",r:"Nodos!A:F",k:"nodos"},
  ];
  for(let i=0;i<hojas.length;i++){
    const h=hojas[i];setLoadMsg(`Cargando ${i+1}/${hojas.length}: <b>${h.n}</b>...`);
    try{const rows=await shGet(h.r);S.data[h.k]=rowsToObj(rows);}
    catch(e){console.error("Error "+h.n+":",e);S.data[h.k]=[];}
  }
  S.connected=true;
}

function render(){
  document.getElementById("app").innerHTML=`${renderTopbar()}<div class="main" id="main">${S.loading?'<div class="loading"><div class="spinner"></div><div id="load-msg">Cargando...</div></div>':renderTab()}</div>${S.modal?renderModal():""}`;
  bindEvents();
}

function renderTopbar(){
  const tabs=[{id:"inventario",ico:"🔩",lbl:"Inventario"},{id:"movimientos",ico:"🔄",lbl:"Movimientos"},{id:"actas",ico:"📋",lbl:"Actas"}];
  return`<div class="topbar">
    <div class="topbar-brand"><img src="data:image/png;base64,${LOGO_B64}" alt="ISL"><span class="nombre">Herramientas<br>Manuales</span></div>
    <div class="topbar-nav">${tabs.map(t=>`<button class="nav-btn ${S.tab===t.id?"active":""}" data-tab="${t.id}">${t.ico} ${t.lbl}</button>`).join("")}</div>
    <div class="topbar-right">
      <a href="index.html" class="topbar-link">← App principal</a>
      <span class="conn-badge ${S.connected?"ok":"err"}">${S.connected?"● Online":"● Offline"}</span>
      <button class="btn btn-sec btn-xs" id="btn-refresh">↺</button>
    </div>
  </div>`;
}

function renderTab(){switch(S.tab){case"inventario":return renderInventario();case"movimientos":return renderMovimientos();case"actas":return renderActas();default:return"";}}

  const f=S.filtros;

  if(f.estado)her=her.filter(h=>h.Estado===f.estado);
  if(f.nodo)her=her.filter(h=>h.NodoActual===f.nodo);

  const rows=her.map(h=>`<tr>
    <td class="td-bold">${h.Codigo}</td><td>${h.Descripcion}</td>
    <td>${h.Marca||"—"}</td><td style="color:var(--txt3)">${h.Modelo||"—"}</td>
    <td><span class="badge b-gris">${h.Categoria}</span></td>
    <td>${h.NodoActual||"—"}</td><td>${estadoBadge(h.Estado)}</td>
    <td>${fmtARS(h.ValorCompra)}</td>
    <td><button class="btn btn-sec btn-xs" data-mover="${h.Codigo}">Mover</button></td>
  </tr>`).join("");
  return`
  <div class="stats">
    <div class="stat" style="border-color:var(--azul2)"><div class="lbl">Activas</div><div class="val" style="color:var(--azul2)">${activas.length}</div></div>
    <div class="stat" style="border-color:var(--verde)"><div class="lbl">Operativas</div><div class="val" style="color:var(--verde)">${operativas}</div></div>
    <div class="stat" style="border-color:var(--azul2)"><div class="lbl">Con Acta</div><div class="val" style="color:var(--azul2)">${conActa}</div></div>
  </div>
  <div class="section-head"><h2>🔩 Inventario Manuales (${her.length})</h2><button class="btn btn-pri" id="btn-alta-her">+ Alta herramienta</button></div>
  <div class="filtros">
    <input placeholder="Buscar..." value="${f.busqueda}" id="f-busqueda" style="width:180px">
    <select id="f-cat"><option value="">Todas las categorías</option>${CATS.map(c=>`<option ${f.categoria===c?"selected":""}>${c}</option>`).join("")}</select>
    <select id="f-estado"><option value="">Todos los estados</option>${ESTADOS.map(e=>`<option ${f.estado===e?"selected":""}>${e}</option>`).join("")}</select>
    <select id="f-nodo"><option value="">Todos los nodos</option>${nodos.map(n=>`<option ${f.nodo===n?"selected":""}>${n}</option>`).join("")}</select>
    <button class="btn btn-sec btn-xs" id="btn-limpiar-f">Limpiar</button>
  </div>
  <div class="card"><div class="tabla-wrap"><table>
    <tr><th>Código</th><th>Descripción</th><th>Marca</th><th>Modelo</th><th>Categoría</th><th>Nodo</th><th>Estado</th><th>Valor</th><th></th></tr>
    ${her.length?rows:'<tr><td colspan="9"><div class="empty"><div class="ico">🔍</div>Sin resultados</div></td></tr>'}
  </table></div></div>`;
}

function renderMovimientos(){
  const movs=[...S.data.movimientos].reverse();
  const rows=movs.map(m=>`<tr>
    <td style="white-space:nowrap">${fmtFecha(m.Fecha)}</td><td style="color:var(--txt3)">${m.Hora||""}</td>
    <td><span class="badge b-azul" style="font-size:10px">${m.TipoMovimiento}</span></td>
    <td><b>${m.Descripcion||m.CodigoHerramienta}</b></td>
    <td>${m.NodoOrigen||"—"}</td><td>${m.NodoDestino||"—"}</td><td>${m.Responsable||"—"}</td>
  </tr>`).join("");
  return`
  <div class="section-head"><h2>🔄 Movimientos</h2><button class="btn btn-pri" id="btn-nuevo-mov">+ Nuevo movimiento</button></div>
  <div class="card"><div class="tabla-wrap"><table>
    <tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Herramienta</th><th>Origen</th><th>Destino</th><th>Responsable</th></tr>

function renderActas(){
  const tab=S.innerTab||"activas";
  function agrupar(lista){const map={};lista.forEach(a=>{if(!map[a.NroActa]){map[a.NroActa]={NroActa:a.NroActa,Fecha:a.Fecha,ReceptorNombre:a.ReceptorNombre,ReceptorDNI:a.ReceptorDNI,ReceptorRol:a.ReceptorRol,Obra:a.Obra,FechaDevolucion:a.FechaDevolucion,herramientas:[]};}map[a.NroActa].herramientas.push({codigo:a.CodigoHerramienta,desc:a.Descripcion,valor:a.ValorReposicion});});return Object.values(map);}
  const activas=agrupar(S.data.actas.filter(a=>!a.FechaDevolucion||a.FechaDevolucion===""));
  const devueltas=agrupar(S.data.actas.filter(a=>a.FechaDevolucion&&a.FechaDevolucion!==""));
  const lista=tab==="activas"?activas:devueltas;
  const rows=lista.map(a=>`<tr>
    <td class="td-bold">${a.NroActa}</td><td>${fmtFecha(a.Fecha)}</td>
    <td style="font-weight:700">${a.ReceptorNombre}</td>
    <td><span class="badge b-gris">${a.ReceptorRol}</span></td>
    <td>${a.Obra}</td>
    <td>${a.herramientas.length} herr.<br><span style="font-size:10px;color:var(--txt3)">${a.herramientas.map(h=>h.codigo).join(", ")}</span></td>
    <td>${fmtARS(a.herramientas.reduce((s,h)=>s+Number(h.valor||0),0))}</td>
    <td>${a.FechaDevolucion?fmtFecha(a.FechaDevolucion):'<span class="badge b-naranja">Activa</span>'}</td>
    <td style="white-space:nowrap">
      <button class="btn btn-sec btn-xs" data-acta-print="${a.NroActa}">🖨 PDF</button>
      ${!a.FechaDevolucion?`<button class="btn btn-rojo btn-xs" data-acta-dev="${a.NroActa}" style="margin-left:3px">Devolver</button>`:""}
    </td>
  </tr>`).join("");
  return`
  <div class="section-head"><h2>📋 Actas Manuales</h2><button class="btn btn-pri" id="btn-nueva-acta">+ Nueva Acta ISL-AM</button></div>
  <div class="inner-tabs">
    <button class="inner-tab ${tab==="activas"?"active":""}" data-inner="activas">📤 Activas (${activas.length})</button>
    <button class="inner-tab ${tab==="devueltas"?"active":""}" data-inner="devueltas">📥 Devueltas (${devueltas.length})</button>
  </div>
  <div class="card"><div class="tabla-wrap"><table>
    <tr><th>N° Acta</th><th>Fecha</th><th>Receptor</th><th>Rol</th><th>Obra</th><th>Herramientas</th><th>Valor repos.</th><th>Dev.</th><th></th></tr>
    ${lista.length?rows:'<tr><td colspan="9"><div class="empty"><div class="ico">📋</div>Sin actas</div></td></tr>'}
  </table></div></div>`;
}

async function guardarHerramienta(){
  const desc=document.getElementById("m-desc").value.trim();
  const cat=document.getElementById("m-cat").value;
  if(!desc||!cat){toast("Completá descripción y categoría","err");return;}
  const cat3=cat.substring(0,3).toUpperCase().replace(/[^A-Z]/g,"");
  const num=String(S.data.herramientas.length+1).padStart(3,"0");
  const codigo="ISL-MAN-"+cat3+"-"+num;
  const nodoIni=document.getElementById("m-nodo-ini")?.value||"Almacén ISL";
  try{
    await shApp("HerramientasManuales",[[uid(),codigo,desc,cat,
      document.getElementById("m-marca").value,document.getElementById("m-modelo").value,
      document.getElementById("m-serie").value,document.getElementById("m-ten").value,
      document.getElementById("m-valor").value||"",hoy(),nodoIni,"Operativa",
      document.getElementById("m-prov").value,"","",document.getElementById("m-obs").value,"NO"]]);
    await shApp("MovimientosManuales",[[uid(),hoy(),hora(),"Alta",codigo,desc,"—",nodoIni,"David Tesido","","","Alta herramienta manual"]]);
    toast("Herramienta "+codigo+" dada de alta");S.modal=null;
    await new Promise(r=>setTimeout(r,1500));await cargarTodo();render();
  }catch(e){toast("Error: "+e.message,"err");}
}

async function guardarMovimiento(){
  const herCod=document.getElementById("m-her").value;
  const tipo=document.getElementById("m-tipo-mov").value;
  const resp=document.getElementById("m-resp").value;
  if(!herCod||!tipo||!resp){toast("Completá los campos obligatorios","err");return;}
  const her=S.data.herramientas.find(h=>h.Codigo===herCod);
  const destino=document.getElementById("m-destino").value;
  const mapEst={"Envío a obra":"En tránsito","Dev. normal Obra→Almacén":"Operativa","Dev. por falla Obra→Almacén":"Operativa","Entrega a Oficial/Supervisor":"Entregada-Acta","Baja definitiva":"Baja","Dev. a proveedor":"Devuelta a proveedor"};
  const nuevoEst=mapEst[tipo]||her?.Estado;
  try{
    await shApp("MovimientosManuales",[[uid(),hoy(),hora(),tipo,herCod,her?.Descripcion||"",her?.NodoActual||"",destino||"",resp,document.getElementById("m-recep").value,document.getElementById("m-nrodoc").value,document.getElementById("m-obs-mov").value]]);
    const idx=S.data.herramientas.findIndex(h=>h.Codigo===herCod);
    if(idx>=0){
      if(destino)await shUpd("HerramientasManuales!K"+(idx+2),[[destino]]);
      if(nuevoEst)await shUpd("HerramientasManuales!L"+(idx+2),[[nuevoEst]]);
    }
    toast("Movimiento registrado");S.modal=null;
    await new Promise(r=>setTimeout(r,1500));await cargarTodo();render();
  }catch(e){toast("Error: "+e.message,"err");}
}

async function guardarActa(){
  const nom=document.getElementById("m-rec-nom").value.trim();
  const dni=document.getElementById("m-rec-dni").value.trim();
  const obra=document.getElementById("m-obra-acta").value;
  if(!nom||!dni||!obra){toast("Completá los campos obligatorios","err");return;}
  const checks=document.querySelectorAll(".her-acta-check:checked");
  if(!checks.length){toast("Seleccioná al menos una herramienta","err");return;}
  const herSel=[];
  checks.forEach(ch=>{const valor=ch.parentElement.querySelector(".her-acta-valor")?.value||"0";herSel.push({codigo:ch.value,desc:ch.dataset.desc,nodo:ch.dataset.nodo,valor});});
  const nroActa="ISL-AM-"+String(S.data.actas.length+1).padStart(4,"0");
  const leg=document.getElementById("m-rec-leg").value;
  const rol=document.getElementById("m-rec-rol").value;
  const obs=document.getElementById("m-obs-acta").value;
  try{
    for(const h of herSel){
      await shApp("ActasManuales",[[uid(),nroActa,"Entrega",hoy(),h.codigo,h.desc,nom,dni,leg,rol,obra,h.valor,"Entregada","","",obs]]);
      const idx=S.data.herramientas.findIndex(x=>x.Codigo===h.codigo);
      if(idx>=0)await shUpd("HerramientasManuales!L"+(idx+2),[["Entregada-Acta"]]);
      await shApp("MovimientosManuales",[[uid(),hoy(),hora(),"Entrega a Oficial/Supervisor",h.codigo,h.desc,h.nodo,nom,"David Tesido",nom,nroActa,""]]);
    }
    toast("Acta "+nroActa+" generada — "+herSel.length+" herramienta"+(herSel.length>1?"s":""));
    setTimeout(()=>imprimirActa(nroActa,nom,dni,rol,obra,herSel),500);
    S.modal=null;await new Promise(r=>setTimeout(r,1500));await cargarTodo();render();
  }catch(e){toast("Error: "+e.message,"err");}
}

async function devolverActa(nroActa){
  if(!confirm("Confirmar devolucion completa del "+nroActa+"?"))return;
  const filas=S.data.actas.map((a,i)=>({...a,idx:i})).filter(a=>a.NroActa===nroActa);
  try{
    for(const a of filas){
      await shUpd("ActasManuales!N"+(a.idx+2),[[hoy()]]);
      await shUpd("ActasManuales!O"+(a.idx+2),[["Devuelta"]]);
      const hi=S.data.herramientas.findIndex(h=>h.Codigo===a.CodigoHerramienta);
      if(hi>=0)await shUpd("HerramientasManuales!L"+(hi+2),[["Operativa"]]);
      await shApp("MovimientosManuales",[[uid(),hoy(),hora(),"Dev. normal Obra\u2192Alm\u00e9n",a.CodigoHerramienta,a.Descripcion,a.Obra,"Alm\u00e9n ISL","David Tesido",a.ReceptorNombre,nroActa,"Devolucion acta"]]);
    }
    toast("Devolucion registrada");
    await new Promise(r=>setTimeout(r,1500));await cargarTodo();render();
  }catch(e){toast("Error: "+e.message,"err");}
}

function imprimirActa(nroActa,receptor,dni,rol,obra,herramientas){
  const total=herramientas.reduce((s,h)=>s+Number(h.valor||0),0);
  const her=S.data.herramientas;
  const filas=herramientas.map((h,i)=>{
    const info=her.find(x=>x.Codigo===h.codigo)||{};
    return "<tr><td style='padding:6px 8px;border:1px solid #CBD5E1;text-align:center'>"+(i+1)+"</td><td style='padding:6px 8px;border:1px solid #CBD5E1;font-weight:700'>"+h.codigo+"</td><td style='padding:6px 8px;border:1px solid #CBD5E1'>"+h.desc+"</td><td style='padding:6px 8px;border:1px solid #CBD5E1'>"+(info.Marca||"—")+"</td><td style='padding:6px 8px;border:1px solid #CBD5E1'>"+(info.Modelo||"—")+"</td><td style='padding:6px 8px;border:1px solid #CBD5E1;text-align:right'>$"+Number(h.valor||0).toLocaleString("es-AR")+"</td></tr>";
  }).join("");
  const html="<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><title>Acta "+nroActa+"</title><style>body{font-family:Arial,sans-serif;font-size:11pt;color:#1A3A5C;margin:2cm;}.header{display:flex;justify-content:space-between;border-bottom:3px solid #C0102E;padding-bottom:10px;margin-bottom:16px;}.logo-txt{font-size:22px;font-weight:900;letter-spacing:2px;}.nro{text-align:right;font-size:18px;font-weight:800;color:#C0102E;}.datos{background:#F1F5F9;border-radius:6px;padding:12px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}.dato .lbl{font-size:8pt;color:#64748B;font-weight:700;}.dato .val{font-weight:700;}table{width:100%;border-collapse:collapse;margin:12px 0;}th{background:#1A3A5C;color:#fff;padding:8px;text-align:left;}.total td{background:#F1F5F9;font-weight:800;border:1px solid #CBD5E1;padding:6px 8px;}.firmas{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;}.firma{text-align:center;border-top:1px solid #1A3A5C;margin-top:50px;padding-top:6px;font-size:9pt;}.aviso{background:#FEF3C7;border:1px solid #F59E0B;border-radius:6px;padding:10px;margin:12px 0;font-size:9pt;color:#92400E;}.pie{text-align:center;font-size:8pt;color:#94A3B8;margin-top:16px;border-top:1px solid #E2E8F0;padding-top:8px;}@media print{body{margin:1cm;}}</style></head><body><div class='header'><div><div class='logo-txt'>ISL</div><div style='font-size:9px;color:#475569'>Instrumental San Lorenzo S.R.L.</div></div><div class='nro'>"+nroActa+"<br><span style='font-size:10px;color:#475569'>Acta de Entrega \u2014 Herramientas Manuales</span></div></div><div class='datos'><div class='dato'><div class='lbl'>Receptor</div><div class='val'>"+receptor+"</div></div><div class='dato'><div class='lbl'>DNI</div><div class='val'>"+dni+"</div></div><div class='dato'><div class='lbl'>Rol</div><div class='val'>"+rol+"</div></div><div class='dato'><div class='lbl'>Obra</div><div class='val'>"+obra+"</div></div><div class='dato'><div class='lbl'>Fecha</div><div class='val'>"+new Date().toLocaleDateString("es-AR")+"</div></div><div class='dato'><div class='lbl'>Gestor</div><div class='val'>David Tesido</div></div></div><table><tr><th style='width:40px'>N\u00b0</th><th style='width:110px'>C\u00f3digo</th><th>Descripci\u00f3n</th><th style='width:90px'>Marca</th><th style='width:90px'>Modelo</th><th style='width:110px;text-align:right'>Valor repos.</th></tr>"+filas+"<tr class='total'><td colspan='5' style='text-align:right'>TOTAL</td><td style='text-align:right'>$"+total.toLocaleString("es-AR")+"</td></tr></table><div class='aviso'>\u26a0 El valor de reposi\u00f3n es referencial. El receptor asume la responsabilidad de custodia y conservaci\u00f3n.</div><div class='firmas'><div class='firma'>Firma Receptor<br><b>"+receptor+"</b><br>DNI: "+dni+"</div><div class='firma'>Firma Gestor<br><b>David Tesido</b><br>Gestor de Herramientas</div></div><div class='pie'>Instrumental San Lorenzo S.R.L. \u00b7 "+nroActa+" \u00b7 Documento interno ISL</div><script>window.onload=()=>window.print();<\/script></body></html>";
  const win=window.open("","_blank");win.document.write(html);win.document.close();
}

function bindEvents(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.tab;S.innerTab="";render();}));
  document.querySelectorAll("[data-inner]").forEach(b=>b.addEventListener("click",()=>{S.innerTab=b.dataset.inner;render();}));
  document.getElementById("btn-refresh")?.addEventListener("click",async()=>{S.loading=true;render();await cargarTodo();S.loading=false;render();});
  document.getElementById("modal-close")?.addEventListener("click",()=>{S.modal=null;render();});
  document.getElementById("modal-bg")?.addEventListener("click",e=>{if(e.target===e.currentTarget){S.modal=null;render();}});
  document.getElementById("btn-alta-her")?.addEventListener("click",()=>{S.modal={tipo:"alta-her"};render();});
  document.getElementById("btn-nuevo-mov")?.addEventListener("click",()=>{S.modal={tipo:"mov"};render();});
  document.getElementById("btn-nueva-acta")?.addEventListener("click",()=>{S.modal={tipo:"acta"};render();});
  document.querySelectorAll("[data-mover]").forEach(b=>b.addEventListener("click",()=>{S.modal={tipo:"mov"};render();setTimeout(()=>{const s=document.getElementById("m-her");if(s)s.value=b.dataset.mover;},50);}));
  document.getElementById("btn-guardar-her")?.addEventListener("click",guardarHerramienta);
  document.getElementById("btn-guardar-mov")?.addEventListener("click",guardarMovimiento);
  document.getElementById("btn-guardar-acta")?.addEventListener("click",guardarActa);
  document.getElementById("f-busqueda")?.addEventListener("input",e=>{S.filtros.busqueda=e.target.value;render();});
  document.getElementById("f-cat")?.addEventListener("change",e=>{S.filtros.categoria=e.target.value;render();});
  document.getElementById("f-estado")?.addEventListener("change",e=>{S.filtros.estado=e.target.value;render();});
  document.getElementById("f-nodo")?.addEventListener("change",e=>{S.filtros.nodo=e.target.value;render();});
  document.getElementById("btn-limpiar-f")?.addEventListener("click",()=>{S.filtros={busqueda:"",categoria:"",estado:"",nodo:""};render();});
  document.querySelectorAll("[data-acta-print]").forEach(b=>b.addEventListener("click",()=>{
    const nroActa=b.dataset.actaPrint;
    const filas=S.data.actas.filter(a=>a.NroActa===nroActa);
    if(!filas.length)return;
    const f=filas[0];
    const hers=filas.map(a=>({codigo:a.CodigoHerramienta,desc:a.Descripcion,valor:a.ValorReposicion}));
    imprimirActa(nroActa,f.ReceptorNombre,f.ReceptorDNI,f.ReceptorRol,f.Obra,hers);
  }));
  document.querySelectorAll("[data-acta-dev]").forEach(b=>b.addEventListener("click",()=>{devolverActa(b.dataset.actaDev);}));
}

(async()=>{S.loading=true;render();try{await cargarTodo();}catch(e){console.error(e);S.connected=false;toast("Error: "+e.message,"err");}S.loading=false;render();})();

</script>
</body>
</html>
