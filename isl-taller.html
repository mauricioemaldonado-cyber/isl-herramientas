<title>ISL Taller</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">

<style>
:root {
  --bg:       #F7F8FA;
  --surface:  #FFFFFF;
  --border:   #DDE1E9;
  --fg1:      #111827;
  --fg2:      #4B5563;
  --fg3:      #9CA3AF;
  --accent:   #1B4F8A;
  --accent2:  #2563EB;
  --ok:       #16A34A;
  --okbg:     #DCFCE7;
  --warn:     #D97706;
  --warnbg:   #FEF3C7;
  --err:      #DC2626;
  --errbg:    #FEE2E2;
  --info:     #2563EB;
  --infobg:   #DBEAFE;
  --font-ui:  "DM Sans", system-ui, sans-serif;
  --font-mono:"DM Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:      #0F1117; --surface: #1A1F2E; --border:  #2D3348;
    --fg1:     #F0F2F8; --fg2:     #9AA3B8; --fg3:     #545D75;
    --accent:  #3B82F6; --accent2: #60A5FA;
    --ok:      #22C55E; --okbg:    #052E16;
    --warn:    #F59E0B; --warnbg:  #1C1200;
    --err:     #F87171; --errbg:   #2D0707;
    --info:    #60A5FA; --infobg:  #0D1F40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:      #0F1117; --surface: #1A1F2E; --border:  #2D3348;
  --fg1:     #F0F2F8; --fg2:     #9AA3B8; --fg3:     #545D75;
  --accent:  #3B82F6; --accent2: #60A5FA;
  --ok:      #22C55E; --okbg:    #052E16;
  --warn:    #F59E0B; --warnbg:  #1C1200;
  --err:     #F87171; --errbg:   #2D0707;
  --info:    #60A5FA; --infobg:  #0D1F40;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-ui);
  font-size: 14px;
  background: var(--bg);
  color: var(--fg1);
  display: flex;
  flex-direction: column;
}

/* ── HEADER ─────────────────────────────── */
.app-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 50;
  background: var(--accent);
  color: #fff;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  height: 52px;
  flex-shrink: 0;
}
.app-brand { font-size: 13px; font-weight: 600; letter-spacing: .04em; opacity: .9; flex-shrink: 0; }
.app-brand span { opacity: .6; font-weight: 400; }
.header-tabs { display: flex; gap: 2px; flex: 1; overflow-x: auto; }
.htab {
  background: none; border: none;
  color: rgba(255,255,255,.65);
  font: 500 13px var(--font-ui);
  padding: 6px 14px; border-radius: 6px;
  cursor: pointer; transition: background .15s, color .15s;
  white-space: nowrap;
}
.htab:hover { background: rgba(255,255,255,.1); color: #fff; }
.htab.active { background: rgba(255,255,255,.18); color: #fff; }
.sync-btn {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  color: #fff; font: 500 12px var(--font-ui);
  padding: 5px 12px; border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0; transition: background .15s;
}
.sync-btn:hover { background: rgba(255,255,255,.25); }
.sync-btn svg { width: 14px; height: 14px; }

/* ── MAIN ───────────────────────────────── */
.app-main { flex: 1; overflow-y: auto; padding: 20px; }

/* ── STATUS ──────────────────────────────── */
.status-bar {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--fg3);
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg3); flex-shrink: 0; }
.status-dot.ok  { background: var(--ok); }
.status-dot.err { background: var(--err); }
.status-dot.spin {
  background: none; border: 2px solid var(--fg3);
  border-top-color: var(--accent);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── FILTRO ──────────────────────────────── */
.filtro-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filtro-row input, .filtro-row select {
  font: 14px var(--font-ui); background: var(--surface); color: var(--fg1);
  border: 1px solid var(--border); border-radius: 7px; padding: 7px 11px;
  outline: none; transition: border-color .15s;
}
.filtro-row input { flex: 1; min-width: 160px; }
.filtro-row select { min-width: 140px; }
.filtro-row input:focus, .filtro-row select:focus { border-color: var(--accent); }

/* ── TABLE ───────────────────────────────── */
.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  background: var(--surface); color: var(--fg2);
  font: 600 11px var(--font-ui); letter-spacing: .06em; text-transform: uppercase;
  padding: 10px 12px; text-align: left;
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.45; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }
.td-code { font: 500 12px var(--font-mono); color: var(--accent2); white-space: nowrap; }
.td-desc { max-width: 220px; }
.td-desc small { display: block; color: var(--fg3); font-size: 11px; margin-top: 2px; }

/* ── BADGE ───────────────────────────────── */
.badge {
  display: inline-block; font: 600 10px var(--font-ui);
  letter-spacing: .04em; padding: 2px 7px; border-radius: 99px; white-space: nowrap;
}
.b-ok    { background: var(--okbg);   color: var(--ok); }
.b-warn  { background: var(--warnbg); color: var(--warn); }
.b-err   { background: var(--errbg);  color: var(--err); }
.b-info  { background: var(--infobg); color: var(--info); }
.b-grey  { background: var(--bg);     color: var(--fg3); border: 1px solid var(--border); }
.b-purple { background: #EDE9FE; color: #7C3AED; }

/* ── EXPAND ROW ─────────────────────────── */
.detail-row td { background: color-mix(in srgb, var(--accent) 3%, var(--surface)); padding: 0; }
.detail-inner {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px 20px; padding: 12px 16px;
}
.kv { display: flex; flex-direction: column; gap: 2px; }
.kv-label { font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--fg3); }
.kv-val   { font-size: 12px; color: var(--fg1); }
.kv-val.responsable { font-weight: 600; color: var(--accent2); }
.row-clickable { cursor: pointer; }
.row-clickable:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }

/* ── ACTA CARD ───────────────────────────── */
.acta-list { display: flex; flex-direction: column; gap: 10px; }
.acta-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.acta-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; cursor: pointer; user-select: none;
}
.acta-head:hover { background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
.acta-nro { font: 600 13px var(--font-mono); color: var(--accent2); flex-shrink: 0; }
.acta-meta { flex: 1; min-width: 0; }
.acta-meta .receptor { font-size: 13px; font-weight: 500; color: var(--fg1); }
.acta-meta .sub { font-size: 11px; color: var(--fg3); margin-top: 1px; }
.acta-estado { flex-shrink: 0; }
.acta-chev { flex-shrink: 0; color: var(--fg3); transition: transform .2s; }
.acta-chev.open { transform: rotate(90deg); }
.acta-body { border-top: 1px solid var(--border); padding: 12px 14px; display: none; }
.acta-body.open { display: block; }
.acta-her-list { display: flex; flex-direction: column; gap: 6px; }
.acta-her {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; background: var(--bg); border-radius: 7px; font-size: 12px;
}
.acta-her-cod  { font: 500 11px var(--font-mono); color: var(--accent2); flex-shrink: 0; }
.acta-her-desc { flex: 1; min-width: 0; color: var(--fg1); }

/* ── EMPTY ───────────────────────────────── */
.empty-msg { text-align: center; padding: 48px 16px; color: var(--fg3); font-size: 13px; }

/* ── INNER TABS ──────────────────────────── */
.inner-tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 16px; }
.itab {
  background: none; border: none; border-bottom: 2px solid transparent; margin-bottom: -2px;
  font: 500 13px var(--font-ui); color: var(--fg2); padding: 8px 14px;
  cursor: pointer; transition: color .15s, border-color .15s; white-space: nowrap;
}
.itab.active { color: var(--accent2); border-bottom-color: var(--accent2); }

/* ── RESPONSIVE ──────────────────────────── */
@media (max-width: 500px) {
  .app-main { padding: 12px; }
  .filtro-row input { min-width: 100%; }
  th.hide-sm, td.hide-sm { display: none; }
}
</style>

<header class="app-header">
  <div class="app-brand">ISL <span>Taller</span></div>
  <nav class="header-tabs">
    <button class="htab active" data-tab="inventario">Inventario</button>
    <button class="htab" data-tab="manuales">H. Manuales</button>
    <button class="htab" data-tab="actas">Actas</button>
  </nav>
  <button class="sync-btn" id="btn-sync">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5" stroke-linecap="round"/>
      <path d="M10 2l3.5.5L13 6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Actualizar
  </button>
</header>

<main class="app-main" id="main">
  <div class="status-bar">
    <div class="status-dot spin" id="status-dot"></div>
    <span id="status-text">Conectando…</span>
  </div>

  <!-- TAB: INVENTARIO -->
  <div id="tab-inventario">
    <div class="filtro-row">
      <input type="search" id="busq" placeholder="Buscar herramienta, código…" autocomplete="off">
      <select id="fil-cat"><option value="">Todas las categorías</option></select>
      <select id="fil-est"><option value="">Todos los estados</option></select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Código</th>
          <th>Descripción</th>
          <th class="hide-sm">Categoría</th>
          <th>Estado</th>
          <th class="hide-sm">Nodo</th>
        </tr></thead>
        <tbody id="tbody-her">
          <tr><td colspan="5"><div class="empty-msg">Cargando…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- TAB: HERRAMIENTAS MANUALES -->
  <div id="tab-manuales" hidden>
    <div class="filtro-row">
      <input type="search" id="busq-man" placeholder="Buscar herramienta manual, código…" autocomplete="off">
      <select id="fil-cat-man"><option value="">Todas las categorías</option></select>
      <select id="fil-est-man"><option value="">Todos los estados</option></select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Código</th>
          <th>Descripción</th>
          <th class="hide-sm">Categoría</th>
          <th>Estado</th>
          <th class="hide-sm">Nodo</th>
        </tr></thead>
        <tbody id="tbody-man">
          <tr><td colspan="5"><div class="empty-msg">Cargando…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- TAB: ACTAS -->
  <div id="tab-actas" hidden>
    <div class="inner-tabs">
      <button class="itab active" data-itab="activas">Activas</button>
      <button class="itab" data-itab="devueltas">Devueltas</button>
    </div>
    <div class="filtro-row">
      <input type="search" id="busq-acta" placeholder="Buscar N° acta, receptor, obra…" autocomplete="off">
    </div>
    <div class="acta-list" id="acta-list">
      <div class="empty-msg">Cargando…</div>
    </div>
  </div>
</main>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJZWetOEG-Uc52df8ARFGpXKaFUBwuCzBfWpqf3Y8w7H91Q0CQeYmJNR3PC_oQk0f-/exec";

const S = {
  herramientas: [],
  manuales: [],
  actas: [],
  loaded: false,
  tab: "inventario",
  itab: "activas",
  // mapa codigo → responsable (ReceptorNombre del acta activa)
  responsables: {},
};

// ── API ──────────────────────────────────────
async function shGet(range) {
  const r = await fetch(APPS_SCRIPT_URL + "?range=" + encodeURIComponent(range) + "&_t=" + Date.now(), { redirect:"follow", mode:"cors" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || "Apps Script error");
  return d.values || [];
}

function rowsToObj(rows) {
  if (!rows.length) return [];
  const [head, ...data] = rows;
  const out = [];
  data.forEach((r, i) => {
    if (r[0] && r[0].toString().trim() !== "") {
      const obj = Object.fromEntries(head.map((k, j) => [k, r[j] || ""]));
      obj._row = i + 2;
      out.push(obj);
    }
  });
  return out;
}

// ── STATUS ───────────────────────────────────
function setStatus(state, msg) {
  document.getElementById("status-dot").className = "status-dot " + state;
  document.getElementById("status-text").textContent = msg;
}

// ── HELPERS ──────────────────────────────────
function escHTML(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function estadoBadge(e) {
  const cl = {
    "Op. Almacén":"b-ok","Operativa":"b-ok",
    "Op. Obra":"b-info","Op. Acta":"b-info",
    "En reparación — Almacén":"b-warn","En reparacion-Almacen":"b-warn",
    "En service externo":"b-warn","En espera — sin reparar":"b-warn","En espera - sin reparar":"b-warn",
    "Extraviada":"b-err","Rota / Inutilizable":"b-err","Baja":"b-err","Devuelta a proveedor":"b-err",
  };
  return `<span class="badge ${cl[e]||"b-grey"}">${escHTML(e||"—")}</span>`;
}
function fmtFecha(v) {
  if (!v) return "—";
  const s = String(v);
  if (s.includes("/")) return s;
  if (s.includes("-") && s.length === 10) { const [y,m,d] = s.split("-"); return `${d}/${m}/${y}`; }
  return s;
}

// ── LOAD ─────────────────────────────────────
async function cargar() {
  setStatus("spin", "Cargando datos…");
  try {
    const [rowsHer, rowsMan, rowsActas] = await Promise.all([
      shGet("Herramientas!A:X"),
      shGet("HerramientasManuales!A:X"),
      shGet("Actas!A:P"),
    ]);
    S.herramientas = rowsToObj(rowsHer);
    S.manuales     = rowsToObj(rowsMan);
    S.actas        = rowsToObj(rowsActas);

    // construir mapa responsables desde actas activas
    S.responsables = {};
    S.actas.forEach(a => {
      const activa = !a.FechaDevolucion || a.FechaDevolucion === "";
      if (activa && a.CodigoHerramienta && a.ReceptorNombre) {
        S.responsables[a.CodigoHerramienta] = a.ReceptorNombre;
      }
    });

    S.loaded = true;
    const now = new Date().toLocaleTimeString("es-AR", { hour:"2-digit", minute:"2-digit" });
    setStatus("ok", S.herramientas.length + " her. · " + S.manuales.length + " man. · " + now);
    poblarFiltros();
    renderTab();
  } catch(e) {
    setStatus("err", "Sin conexión — " + e.message);
    document.getElementById("tbody-her").innerHTML = '<tr><td colspan="5"><div class="empty-msg">No se pudo cargar. Verificá la conexión y actualizá.</div></td></tr>';
    document.getElementById("tbody-man").innerHTML = '<tr><td colspan="5"><div class="empty-msg">No se pudo cargar.</div></td></tr>';
    document.getElementById("acta-list").innerHTML = '<div class="empty-msg">No se pudo cargar.</div>';
  }
}

// ── FILTROS ──────────────────────────────────
function poblarFiltros() {
  function llenar(lista, selCatId, selEstId) {
    const cats = [...new Set(lista.map(h => h.Categoria).filter(Boolean))].sort();
    const ests = [...new Set(lista.map(h => h.Estado).filter(Boolean))].sort();
    document.getElementById(selCatId).innerHTML =
      '<option value="">Todas las categorías</option>' + cats.map(c => `<option>${escHTML(c)}</option>`).join("");
    document.getElementById(selEstId).innerHTML =
      '<option value="">Todos los estados</option>' + ests.map(e => `<option>${escHTML(e)}</option>`).join("");
  }
  llenar(S.herramientas, "fil-cat", "fil-est");
  llenar(S.manuales,     "fil-cat-man", "fil-est-man");
}

// ── RENDER INVENTARIO GENÉRICO ────────────────
let openRowHer = null;
let openRowMan = null;

function renderTablaHer(lista, tbodyId, openRowRef, setOpenRow, responsables) {
  const tbody = document.getElementById(tbodyId);
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty-msg">Sin resultados.</div></td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(h => {
    const id = escHTML(h.Codigo);
    const isOpen = openRowRef === h.Codigo;
    const resp = responsables[h.Codigo] || "";
    const detailRow = isOpen ? `
      <tr class="detail-row">
        <td colspan="5">
          <div class="detail-inner">
            <div class="kv"><div class="kv-label">Marca / Modelo</div><div class="kv-val">${escHTML(h.Marca||"—")} ${escHTML(h.Modelo||"")}</div></div>
            <div class="kv"><div class="kv-label">N° Serie</div><div class="kv-val">${escHTML(h.NumeroSerie||h["N°Serie"]||h.NroSerie||"—")}</div></div>
            ${resp ? `<div class="kv"><div class="kv-label">Responsable actual</div><div class="kv-val responsable">${escHTML(resp)}</div></div>` : ""}
            <div class="kv"><div class="kv-label">Alta</div><div class="kv-val">${fmtFecha(h.FechaAlta||h.Fecha||"")}</div></div>
            <div class="kv"><div class="kv-label">Prox. mantenimiento</div><div class="kv-val">${fmtFecha(h.ProxMantenimiento||h.ProximoMtto||"")}</div></div>
            <div class="kv"><div class="kv-label">Observaciones</div><div class="kv-val">${escHTML(h.Observaciones||h.Obs||"—")}</div></div>
          </div>
        </td>
      </tr>` : "";
    return `
      <tr class="row-clickable" data-cod="${id}">
        <td class="td-code">${id}</td>
        <td class="td-desc">
          ${escHTML(h.Descripcion||"—")}
          <small>${escHTML(h.Marca||"")}${h.Modelo?" · "+escHTML(h.Modelo):""}</small>
        </td>
        <td class="hide-sm">${escHTML(h.Categoria||"—")}</td>
        <td>
          ${estadoBadge(h.Estado)}
          ${resp ? `<div style="font-size:10px;color:var(--accent2);margin-top:3px">👤 ${escHTML(resp)}</div>` : ""}
        </td>
        <td class="hide-sm" style="color:var(--fg2);font-size:12px">${escHTML(h.NodoActual||h.Nodo||"—")}</td>
      </tr>${detailRow}`;
  }).join("");

  tbody.querySelectorAll("tr.row-clickable").forEach(tr => {
    tr.addEventListener("click", () => {
      const cod = tr.dataset.cod;
      setOpenRow(openRowRef === cod ? null : cod);
    });
  });
}

function renderInventario() {
  const busq = (document.getElementById("busq")?.value || "").toLowerCase();
  const cat  = document.getElementById("fil-cat")?.value || "";
  const est  = document.getElementById("fil-est")?.value || "";
  const lista = S.herramientas.filter(h => {
    if (cat && h.Categoria !== cat) return false;
    if (est && h.Estado !== est) return false;
    if (busq && !(
      (h.Codigo||"").toLowerCase().includes(busq) ||
      (h.Descripcion||"").toLowerCase().includes(busq) ||
      (h.Marca||"").toLowerCase().includes(busq) ||
      (h.Modelo||"").toLowerCase().includes(busq)
    )) return false;
    return true;
  });
  renderTablaHer(lista, "tbody-her", openRowHer, v => { openRowHer = v; renderInventario(); }, S.responsables);
}

function renderManuales() {
  const busq = (document.getElementById("busq-man")?.value || "").toLowerCase();
  const cat  = document.getElementById("fil-cat-man")?.value || "";
  const est  = document.getElementById("fil-est-man")?.value || "";
  const lista = S.manuales.filter(h => {
    if (cat && h.Categoria !== cat) return false;
    if (est && h.Estado !== est) return false;
    if (busq && !(
      (h.Codigo||"").toLowerCase().includes(busq) ||
      (h.Descripcion||"").toLowerCase().includes(busq) ||
      (h.Marca||"").toLowerCase().includes(busq) ||
      (h.Modelo||"").toLowerCase().includes(busq)
    )) return false;
    return true;
  });
  // manuales usan los mismos responsables (por código de herramienta)
  renderTablaHer(lista, "tbody-man", openRowMan, v => { openRowMan = v; renderManuales(); }, S.responsables);
}

// ── ACTAS ─────────────────────────────────────
function agruparActas(lista) {
  const map = {};
  lista.forEach(a => {
    if (!map[a.NroActa]) {
      map[a.NroActa] = {
        NroActa: a.NroActa, Fecha: a.Fecha,
        ReceptorNombre: a.ReceptorNombre, ReceptorDNI: a.ReceptorDNI,
        ReceptorRol: a.ReceptorRol, Obra: a.Obra,
        FechaDevolucion: a.FechaDevolucion, herramientas: []
      };
    }
    map[a.NroActa].herramientas.push(a);
    if (a.FechaDevolucion) map[a.NroActa].FechaDevolucion = a.FechaDevolucion;
  });
  return Object.values(map).sort((a,b) => a.NroActa < b.NroActa ? 1 : -1);
}

let openActas = new Set();

function renderActas() {
  const busq = (document.getElementById("busq-acta")?.value || "").toLowerCase();
  const esActiva = a => !a.FechaDevolucion || a.FechaDevolucion === "";
  const todasActivas   = agruparActas(S.actas.filter(a => esActiva(a)));
  const todasDevueltas = agruparActas(S.actas.filter(a => !esActiva(a)));
  let lista = S.itab === "activas" ? todasActivas : todasDevueltas;
  if (busq) {
    lista = lista.filter(a =>
      (a.NroActa||"").toLowerCase().includes(busq) ||
      (a.ReceptorNombre||"").toLowerCase().includes(busq) ||
      (a.Obra||"").toLowerCase().includes(busq)
    );
  }

  document.querySelectorAll(".itab").forEach(btn => {
    const t = btn.dataset.itab;
    const cnt = t === "activas" ? todasActivas.length : todasDevueltas.length;
    btn.textContent = (t === "activas" ? "Activas" : "Devueltas") + ` (${cnt})`;
    btn.classList.toggle("active", t === S.itab);
  });

  const cont = document.getElementById("acta-list");
  if (!lista.length) { cont.innerHTML = '<div class="empty-msg">Sin actas en esta categoría.</div>'; return; }

  cont.innerHTML = lista.map(a => {
    const key    = a.NroActa;
    const isOpen = openActas.has(key);
    const devTodas = a.herramientas.every(h => h.FechaDevolucion && h.FechaDevolucion !== "");
    const estadoBadgeActa = devTodas
      ? `<span class="badge b-ok">Devuelta</span>`
      : a.herramientas.some(h => h.FechaDevolucion && h.FechaDevolucion !== "")
        ? `<span class="badge b-warn">Parcial</span>`
        : `<span class="badge b-info">Activa</span>`;

    const hers = a.herramientas.map(h => `
      <div class="acta-her">
        <div class="acta-her-cod">${escHTML(h.CodigoHerramienta||"")}</div>
        <div class="acta-her-desc">${escHTML(h.Descripcion||"")}</div>
        ${h.FechaDevolucion ? `<span class="badge b-ok" style="font-size:9px">Dev. ${fmtFecha(h.FechaDevolucion)}</span>` : ""}
      </div>`).join("");

    return `
      <div class="acta-card">
        <div class="acta-head" data-acta="${escHTML(key)}">
          <div class="acta-nro">${escHTML(a.NroActa)}</div>
          <div class="acta-meta">
            <div class="receptor">${escHTML(a.ReceptorNombre||"—")} <span style="font-weight:400;color:var(--fg3)">· ${escHTML(a.ReceptorRol||"")}</span></div>
            <div class="sub">${fmtFecha(a.Fecha)} · ${escHTML(a.Obra||"—")} · ${a.herramientas.length} herramienta${a.herramientas.length!==1?"s":""}</div>
          </div>
          <div class="acta-estado">${estadoBadgeActa}</div>
          <svg class="acta-chev ${isOpen?"open":""}" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 3l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="acta-body ${isOpen?"open":""}">
          <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--fg2)">
            <span><b>DNI:</b> ${escHTML(a.ReceptorDNI||"—")}</span>
            ${a.FechaDevolucion ? `<span><b>Devolución:</b> ${fmtFecha(a.FechaDevolucion)}</span>` : ""}
          </div>
          <div class="acta-her-list">${hers}</div>
        </div>
      </div>`;
  }).join("");

  cont.querySelectorAll(".acta-head").forEach(head => {
    head.addEventListener("click", () => {
      const key = head.dataset.acta;
      if (openActas.has(key)) openActas.delete(key); else openActas.add(key);
      renderActas();
    });
  });
}

// ── RENDER TAB ───────────────────────────────
function renderTab() {
  ["inventario","manuales","actas"].forEach(t => {
    document.getElementById("tab-" + t).hidden = S.tab !== t;
  });
  document.querySelectorAll(".htab").forEach(b => b.classList.toggle("active", b.dataset.tab === S.tab));
  if (S.tab === "inventario") renderInventario();
  else if (S.tab === "manuales") renderManuales();
  else renderActas();
}

// ── EVENTS ───────────────────────────────────
document.querySelectorAll(".htab").forEach(btn => {
  btn.addEventListener("click", () => { S.tab = btn.dataset.tab; openRowHer = null; openRowMan = null; renderTab(); });
});
document.querySelectorAll(".itab").forEach(btn => {
  btn.addEventListener("click", () => { S.itab = btn.dataset.itab; renderActas(); });
});
document.getElementById("btn-sync").addEventListener("click", cargar);

["busq","fil-cat","fil-est"].forEach(id =>
  document.getElementById(id)?.addEventListener("input", () => { openRowHer = null; renderInventario(); })
);
["busq-man","fil-cat-man","fil-est-man"].forEach(id =>
  document.getElementById(id)?.addEventListener("input", () => { openRowMan = null; renderManuales(); })
);
document.getElementById("busq-acta")?.addEventListener("input", renderActas);

// ── INIT ─────────────────────────────────────
cargar();
</script>
